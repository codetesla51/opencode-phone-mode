# opencode-phone-mode configuration.
#
# Every key is optional: omitted keys keep the default shown below.
# Unknown keys are rejected, so check spelling when copying examples.
# Values are validated when the config is loaded.

# --- Services and radios ----------------------------------------------------

# systemd --user units that must survive the switch to multi-user.target.
# Units already active are left running; inactive ones are enabled and started.
# Default: ["opencode-serve.service", "opencode-telegram.service"]
keep_services = ["opencode-serve.service", "opencode-telegram.service"]

# rfkill device types that stay unblocked. Every other type is soft-blocked.
# Common values: "wlan", "bluetooth", "wwan", "gps", "nfc", "ufs", "wimax".
# "wifi" is accepted as an alias for "wlan".
# Default: ["wlan"]
keep_radios_on = ["wlan"]

# --- Backlight ---------------------------------------------------------------

# false leaves the backlight completely untouched (no snapshot, no change).
# Default: true
manage_backlight = true

# Backlight percentage in phone mode: 0-100. Use -1 to leave it untouched.
# Default: 0
brightness = 0

# Device name under /sys/class/backlight, e.g. "intel_backlight".
# Empty picks the first device found.
# Default: ""
backlight_device = ""

# --- CPU --------------------------------------------------------------------

# false leaves the governor completely untouched.
# Default: true
manage_governor = true

# Any governor listed in
# /sys/devices/system/cpu/cpufreq/policy*/scaling_available_governors
# (for example "powersave", "performance", "schedutil", "ondemand").
# Default: "powersave"
governor = "powersave"

# false leaves scaling_max_freq completely untouched.
# Default: true
manage_max_freq = true

# Cap each CPU policy's scaling_max_freq to this percentage of its hardware
# maximum: 1-100. The kernel's scaling_min_freq is the lower bound.
# Default: 40
cpu_max_freq_percent = 40

# false leaves turbo completely untouched.
# Default: true
manage_turbo = true

# Turbo boost in phone mode: true or false.
# Default: false
turbo = false

# --- Other power settings ----------------------------------------------------

# Run powertop --auto-tune. Needs powertop installed. It changes kernel tunables
# that off has no portable way to undo. Set false to skip it entirely.
# Default: true
powertop = true

# Put non-boot display controllers into runtime suspend (power/control=auto),
# switch off bbswitch and stop nvidia-persistenced when those exist.
# Set false to leave all GPU settings alone.
# Default: true
disable_dgpu = true

# --- Lid ---------------------------------------------------------------------

# false leaves logind lid settings completely untouched.
# Default: true
manage_lid = true

# systemd-logind lid action in phone mode. One of: "ignore", "suspend",
# "hibernate", "hybrid-sleep", "suspend-then-hibernate", "poweroff",
# "reboot", "halt", "kexec", "lock".
# "ignore" keeps the machine running with the lid closed.
# Default: "ignore"
lid_switch = "ignore"

# --- Radios, services, target ------------------------------------------------

# false leaves every rfkill device exactly as it was.
# Default: true
manage_radios = true

# false leaves linger and keep_services exactly as they were.
# Default: true
manage_services = true

# false keeps the current systemd target; no isolation happens.
# Default: true
isolate_target = true

# --- Battery guard -----------------------------------------------------------

# status warns below this battery percentage and on refuses to go headless
# while discharging. 0-100; 0 disables the check. Charging/full always pass.
# Default: 15
battery_exit_percent = 15

# --- Restore fallback --------------------------------------------------------

# These values are used only when off runs without state.json. With a state
# file present, off restores the recorded values exactly and ignores this table.
[restore]

# Backlight percentage, 0-100.
brightness = 100

# Governor name, or "" to leave the current governor alone.
governor = ""

# CPU frequency cap, 1-100 percent of hardware maximum.
cpu_max_freq_percent = 100

# Turbo: true or false.
turbo = true

# Lid action (same accepted values as lid_switch), or "" to remove our drop-in
# and fall back to the system default.
lid_switch = "suspend"

# true leaves Bluetooth unblocked and its service running.
bluetooth = true

# true enables linger and starts keep_services.
services_running = true
